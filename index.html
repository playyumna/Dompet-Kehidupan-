<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5eee5"><link rel="manifest" href="manifest.webmanifest"><title>Dompet Kehidupan</title>
<style>
:root{--bg:#f7f3ed;--card:#fffdfa;--ink:#302b27;--muted:#82786f;--accent:#80664f;--line:#e9e0d6;--green:#34745a;--red:#b64e46}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui}header{background:#efe5d9;padding:22px 18px}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:var(--muted)}main{max-width:760px;margin:auto;padding:14px;display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px}.balance{font-size:29px;font-weight:800;margin:5px 0 12px}.muted,small,.note{color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#faf6f0;padding:11px;border-radius:11px}.stat strong{display:block;margin-top:4px}h2{font-size:17px;margin:0 0 12px}label{display:grid;gap:5px;font-size:12px;color:var(--muted);margin:8px 0}input,select,button{font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;width:100%;background:white;color:var(--ink)}button{background:var(--accent);color:white;border:0;font-weight:650}.row{display:flex;gap:9px}.row>*{flex:1}.item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}.item:last-child{border:0}.item strong{display:block}.item small{display:block}.in{color:var(--green)}.out{color:var(--red)}.amount{font-weight:700;text-align:right;white-space:nowrap}.del{width:auto;padding:5px 8px;margin-top:5px;background:#f8e8e5;color:var(--red);font-size:12px}.secondary{background:#eee6dc;color:var(--ink)}.note{font-size:12px;line-height:1.5}.toolbar{display:flex;gap:8px;align-items:end}.toolbar label{flex:1}.toolbar button{width:auto}@media(max-width:430px){.row{display:grid;grid-template-columns:1fr}.balance{font-size:26px}}
</style></head><body><header><h1>Dompet Kehidupan</h1><p>Pembukuan pribadi • offline-ready</p></header><main>
<section class="card"><div class="muted">Saldo saat ini</div><div class="balance" id="balance"></div><div class="stats"><div class="stat">Total pemasukan<strong class="in" id="income"></strong></div><div class="stat">Total pengeluaran<strong class="out" id="expense"></strong></div></div><p class="note" id="baseNote"></p></section>
<section class="card"><h2>Tambah transaksi</h2><form id="form"><div class="row"><label>Jenis<select id="type"><option value="out">Pengeluaran</option><option value="in">Pemasukan</option></select></label><label>Tanggal<input id="date" type="date" required></label></div><div class="row"><label>Nominal (Rp)<input id="amount" type="number" min="1" step="1" required></label><label>Kategori<select id="category"><option>Kebutuhan</option><option>Keluarga</option><option>Usaha</option><option>Utang-piutang</option><option>Transportasi</option><option>Rumah tangga</option><option>Makanan</option><option>Pendidikan</option><option>Sosial</option><option>Lainnya</option></select></label></div><label>Keterangan<input id="description" maxlength="120" required placeholder="Contoh: gas tabung"></label><button>Simpan transaksi</button></form></section>
<section class="card"><h2>Riwayat transaksi</h2><div class="toolbar"><label>Filter bulan<input id="month" type="month"></label><button class="secondary" id="all">Semua</button></div><div id="history"></div></section>
<section class="card"><h2>Backup & ekspor</h2><div class="row"><button class="secondary" id="backup">Ekspor backup</button><button class="secondary" id="csv">Unduh CSV</button></div><label>Pulihkan backup JSON<input id="restore" type="file" accept="application/json"></label><p class="note">Data tersimpan di perangkat/browser ini. Ekspor backup berkala. Sinkronisasi otomatis cloud belum disediakan.</p></section>
</main><script>

let db=JSON.parse(localStorage.getItem(KEY)||'null');
if(!db){db=SEED;localStorage.setItem(KEY,JSON.stringify(db))}
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
const now=new Date(),localDate=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,10);
$('date').value=localDate;$('month').value=localDate.slice(0,7);
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function render(){let inc=0,exp=0;db.transactions.forEach(t=>t.type==='in'?inc+=t.amount:exp+=t.amount);$('balance').textContent=fmt(db.openingBalance+inc-exp);$('income').textContent=fmt(inc);$('expense').textContent=fmt(exp);$('baseNote').textContent='Saldo awal: '+fmt(db.openingBalance)+' • '+db.openingLabel+' • '+db.transactions.length+' transaksi dimuat.';
let m=$('month').value,arr=[...db.transactions].filter(t=>!m||t.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);$('history').innerHTML='';
if(!arr.length){$('history').textContent='Belum ada transaksi pada periode ini.';return}
arr.forEach(t=>{let el=document.createElement('div');el.className='item';let l=document.createElement('div'),r=document.createElement('div');let s=document.createElement('strong');s.textContent=t.description;let sm=document.createElement('small');sm.textContent=t.date+' • '+t.category;l.append(s,sm);let am=document.createElement('div');am.className='amount '+(t.type==='in'?'in':'out');am.textContent=(t.type==='in'?'+':'−')+fmt(t.amount);let del=document.createElement('button');del.className='del';del.textContent='Hapus';del.onclick=()=>{if(confirm('Hapus transaksi ini?')){db.transactions=db.transactions.filter(x=>x.id!==t.id);save()}};r.append(am,del);el.append(l,r);$('history').append(el)})}
$('form').onsubmit=e=>{e.preventDefault();let amount=Number($('amount').value);if(!Number.isSafeInteger(amount)||amount<1)return alert('Nominal tidak valid');db.transactions.push({id:Date.now(),type:$('type').value,date:$('date').value,amount,category:$('category').value,description:$('description').value.trim()});e.target.reset();$('date').value=localDate;save()};
$('month').onchange=render;$('all').onclick=()=>{$('month').value='';render()};
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('backup').onclick=()=>download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'dompet-kehidupan-backup.json');
$('csv').onclick=()=>{let rows=[['Tanggal','Jenis','Kategori','Keterangan','Nominal'],...db.transactions.map(t=>[t.date,t.type==='in'?'Pemasukan':'Pengeluaran',t.category,t.description,t.amount])];download(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),'dompet-kehidupan.csv')};
$('restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Number.isFinite(x.openingBalance)||!Array.isArray(x.transactions))throw 0;if(confirm('Ganti semua data aplikasi dengan backup?')){db=x;save();alert('Backup berhasil dipulihkan')}}catch{alert('File backup tidak valid')}e.target.value=''};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
